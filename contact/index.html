<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — AI Book Reading</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .page-wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 24px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-header {
            margin-bottom: 40px;
            display: flex;
            align-items: center;
        }

        .nav-header a {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-weight: 700;
            font-size: 21px;
            letter-spacing: -1.1px;
        }

        .nav-header img {
            width: 27px;
            height: 27px;
        }

        h1 {
            font: 500 34px/1.2 var(--serif);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 15px;
            line-height: 1.7;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .contact-box {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 30px;
            margin-top: 24px;
        }

        .contact-box a {
            color: var(--green);
            font-weight: 600;
            text-decoration: none;
            font-size: 16px;
        }

        .contact-box a:hover {
            text-decoration: underline;
        }

        .page-footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--line);
            margin-top: auto;
        }

        .page-footer a {
            color: var(--muted);
            margin: 0 8px;
            text-decoration: none;
        }

        .page-footer a:hover {
            color: var(--green);
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.15px;
            color: #6f756a;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .brand-dot {
            color: #73917b;
        }
    </style>
</head>

<body>
    <div class="page-wrap">
        <header class="nav-header">
            <a href="/"><img src="/logo.png" alt="Logo" /><span>AI Reading<span class="brand-dot">.</span></span></a>
        </header>
        <main>
            <span class="eyebrow">Contact</span>
            <h1>Get in touch.</h1>
            <p>Have a question, feedback, or found a bug? We'd love to hear from you. Reach out directly and we will get
                back to you as soon as possible.</p>

            <div class="contact-box">
                <p
                    style="margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: #6f756a;">
                    Email Support</p>
                <a href="mailto:support@freeaibookreader.vercel.app">support@freeaibookreader.vercel.app</a>
            </div>
        </main>
    </div>
    <footer class="page-footer">
        <a href="/about">About</a> · <a href="/contact">Contact</a> · <a href="/faq">FAQ</a> · <a
            href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
        <p style="margin-top: 12px; font-size: 12px;">Made by Amarachintha Akhil.</p>
    </footer>
</body>

</html>
